server.port=8080

spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:asset_tracker_db}
spring.mongodb.authentication-database=${MONGODB_AUTH_DATABASE:asset_tracker_db}
spring.mongodb.username=${MONGODB_USERNAME:}
spring.mongodb.password=${MONGODB_PASSWORD:}

# To run the application with a different MongoDB configuration, you can set the following environment variables before starting the application:
# export MONGODB_HOST=localhost
# export MONGODB_PORT=27017
# export MONGODB_DATABASE=asset_tracker_db
# export MONGODB_AUTH_DATABASE=asset_tracker_db
# export MONGODB_USERNAME=your_user
# export MONGODB_PASSWORD=your_pass

spring.output.ansi.enabled=always
logging.level.com.example.assettracker=DEBUG

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always